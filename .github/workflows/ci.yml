name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Demo end-to-end (PDF step skips without lilypond)
        run: PYTHONPATH=src python -m fuzzyscore.cli demo "$RUNNER_TEMP/demo"
      - name: Audit demo output
        run: PYTHONPATH=src python -m fuzzyscore.cli audit "$RUNNER_TEMP/demo/night-walk.musicxml"
