[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyscore"
version = "0.1.2"
description = "Fuzzy-clue bass score generator: reconcile chord sheets, ASCII tabs and rough MIDI into a notation+TAB practice pack"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fuzzyscore contributors"}]
keywords = ["bass", "tab", "musicxml", "lilypond", "transcription", "agent"]

[project.scripts]
fuzzyscore = "fuzzyscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
